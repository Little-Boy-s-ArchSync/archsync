name: ArchSync release delivery

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            archsync-core/pnpm-lock.yaml
            archsync-guardian/pnpm-lock.yaml
            archsync-benchmark/pnpm-lock.yaml
            archsync-mcp/pnpm-lock.yaml
            archsync-examples/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify release ref matches package version
        run: pnpm run release:verify-ref
      - name: Verify tagged release commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - run: pnpm run bootstrap
      - run: pnpm run verify:all
      - run: pnpm run demo
      - run: pnpm run release:pack
      - run: pnpm run security:audit -- --output artifacts/security/dependency-audit.json
      - run: pnpm run release:rollback-drill -- --output artifacts/security/rollback-drill.json
      - name: Upload exact release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archsync-release-payload
          if-no-files-found: error
          retention-days: 14
          path: release/
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archsync-release-security-evidence
          if-no-files-found: error
          retention-days: 14
          path: artifacts/security/

  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact release payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: archsync-release-payload
          path: release
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; immutable assets will not be overwritten." >&2
            exit 1
          fi
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
