name: ArchSync release delivery

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            archsync-core/pnpm-lock.yaml
            archsync-guardian/pnpm-lock.yaml
            archsync-benchmark/pnpm-lock.yaml
            archsync-examples/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bootstrap
      - run: pnpm run verify:all
      - run: pnpm run demo
      - run: pnpm run release:pack
      - run: cp repos.lock.json release/repos.lock.json
      - uses: actions/upload-artifact@v7
        with:
          name: archsync-release-candidate
          if-no-files-found: error
          path: release/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
